<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="An open Sol tin showing the kava pouches inside, with the lid resting beside it">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFE9D0"/>
      <stop offset="100%" stop-color="#F0BF82"/>
    </radialGradient>
    <radialGradient id="lid2" cx="40%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#FFB37A"/>
      <stop offset="35%" stop-color="#FF7A3D"/>
      <stop offset="75%" stop-color="#E8472D"/>
      <stop offset="100%" stop-color="#B8265B"/>
    </radialGradient>
    <radialGradient id="lidSheen" cx="40%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wellInside" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E9D6B0"/>
      <stop offset="100%" stop-color="#7B5E36"/>
    </radialGradient>
    <linearGradient id="wellSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E1F49"/>
      <stop offset="100%" stop-color="#6A0F30"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFAF1"/>
      <stop offset="100%" stop-color="#DDD0B5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg2)"/>

  <!-- contact shadow under open tin -->
  <ellipse cx="640" cy="900" rx="380" ry="38" fill="#1E1B4B" opacity="0.20"/>
  <!-- contact shadow under lid -->
  <ellipse cx="220" cy="800" rx="220" ry="22" fill="#1E1B4B" opacity="0.20"/>

  <!-- ====== OPEN TIN (right side) ====== -->
  <g transform="translate(640 600)">
    <!-- outer rim ring (the side band) -->
    <ellipse cx="0" cy="60" rx="380" ry="56" fill="url(#wellSide)"/>
    <!-- the well (interior viewed from above) -->
    <ellipse cx="0" cy="0" rx="380" ry="120" fill="url(#wellInside)"/>
    <!-- inner rim shadow -->
    <ellipse cx="0" cy="0" rx="362" ry="108" fill="none" stroke="#1E1B4B" stroke-width="6" opacity="0.25"/>

    <!-- pouches arranged inside -->
    <g>
      <!-- back row -->
      <g transform="translate(-200 -45)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
      <g transform="translate(-30 -58)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
      <g transform="translate(150 -50)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
      <!-- middle -->
      <g transform="translate(-240 -8)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
      <g transform="translate(-80 -10)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
      <g transform="translate(90 -6)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
      <g transform="translate(250 0)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
      <!-- front -->
      <g transform="translate(-160 50)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
      <g transform="translate(20 60)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
      <g transform="translate(190 56)"><rect x="-50" y="-22" width="100" height="44" rx="22" fill="url(#pouch)" stroke="#C8B98F" stroke-width="1.5"/></g>
    </g>
  </g>

  <!-- ====== LID (left side, leaning) ====== -->
  <g transform="translate(220 580) rotate(-12)">
    <!-- side rim of the lid -->
    <ellipse cx="0" cy="32" rx="240" ry="34" fill="#7A1739"/>
    <!-- lid face -->
    <circle r="240" fill="url(#lid2)"/>
    <ellipse cx="-50" cy="-72" rx="170" ry="100" fill="url(#lidSheen)"/>
    <circle r="232" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.30"/>
    <circle r="208" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.20"/>

    <g text-anchor="middle" fill="#FFF8F0" font-family="'Fraunces', serif">
      <text y="-12" font-size="180" font-weight="700" letter-spacing="-8">SOL</text>
      <text y="42" font-style="italic" font-size="28" fill="#FFE9D6">mint</text>
      <text y="92" font-family="'Inter', system-ui, sans-serif" font-size="13" letter-spacing="3" fill="#FFE9D6" font-weight="600">20 KAVA POUCHES</text>
    </g>
  </g>
</svg>
